<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fashion Selection · 後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#FAF8F4;--surface:#FFF;--ink:#2B2925;--muted:#8A8378;--line:#E4DED3;--accent:#46563F;--accent-soft:#EBEEE6;--heart:#B5543E;--danger:#B5443E;}
*{box-sizing:border-box;}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;font-size:16px;line-height:1.6;}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px 120px;}
h1{font-family:"Fraunces",serif;font-weight:500;}
.btn{border:0;border-radius:11px;font-family:inherit;font-size:15px;cursor:pointer;padding:11px 18px;min-height:44px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink);}
.btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);}
input,textarea,select{width:100%;font-family:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px;min-height:42px;}
textarea{min-height:60px;resize:vertical;}
label{display:block;font-size:12px;color:var(--muted);letter-spacing:.5px;margin:10px 0 4px;}
#login{max-width:380px;margin:14vh auto 0;padding:0 20px;text-align:center;}
#login h1{font-size:26px;margin-bottom:4px;}
#login p{color:var(--muted);margin-top:0;}
#login .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:left;margin-top:18px;}
#login .btn{width:100%;margin-top:16px;}
.err{color:var(--danger);font-size:14px;margin-top:10px;min-height:18px;}
#admin{display:none;}
.top{display:flex;align-items:center;justify-content:space-between;padding:20px 0 6px;}
.top h1{font-size:22px;margin:0;}
.toolbar{display:flex;gap:10px;margin:14px 0 18px;align-items:center;flex-wrap:wrap;}
.toolbar .search{flex:1;min-width:200px;border-radius:999px;padding:11px 16px;}
.count{color:var(--muted);font-size:13px;white-space:nowrap;}
.cardgrid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;}
.card.dirty{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
.card.selected{outline:2px solid var(--accent);outline-offset:2px;}
.selbox{position:absolute;top:8px;left:8px;z-index:3;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:8px;padding:2px 5px;cursor:pointer;}
.selbox input{width:20px;height:20px;min-height:0;vertical-align:middle;cursor:pointer;}
.card label{margin:10px 0 4px;}
.card .row2{display:flex;gap:10px;}.card .row2>div{flex:1;min-width:0;}
.card textarea{min-height:60px;}
.pp{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;}
.pp summary{font-size:12px;color:var(--muted);cursor:pointer;list-style:none;}
.pp summary::before{content:"▸ ";}
.pp[open] summary::before{content:"▾ ";}
.pp .pp-ta{min-height:120px;margin-top:6px;}
.cardbar{display:flex;justify-content:space-between;gap:10px;margin-top:14px;}
.cardbar .btn{padding:9px 14px;min-height:40px;font-size:14px;}
.cardbar .save:disabled{opacity:.4;cursor:default;}
.strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
.ph{position:relative;width:92px;height:122px;border-radius:8px;overflow:hidden;border:3px solid transparent;background:#F1ECE3;}
.ph.cover{border-color:var(--accent);}
.ph img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block;}
.ph .del{position:absolute;top:2px;right:2px;width:24px;height:24px;border:0;border-radius:50%;background:rgba(43,41,37,.78);color:#fff;font-size:13px;cursor:pointer;line-height:1;}
.ph .cv{position:absolute;bottom:0;left:0;right:0;background:var(--accent);color:#fff;font-size:11px;text-align:center;}
.addph{width:92px;height:122px;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--muted);cursor:pointer;background:var(--surface);}
#sentinel{height:1px;}
#busy{position:fixed;inset:0;background:rgba(250,248,244,.7);display:none;align-items:center;justify-content:center;z-index:60;font-size:15px;color:var(--accent);}
#pzoom{display:none;position:fixed;inset:0;background:rgba(20,18,16,.86);z-index:70;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
#pzoom img{max-width:92vw;max-height:78vh;object-fit:contain;border-radius:8px;background:#F1ECE3;}
.pz-bar{display:flex;gap:12px;margin-top:18px;align-items:center;}
.pz-bar .cur{color:#fff;font-size:13px;opacity:.85;}
#mergebar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px;gap:12px;align-items:center;justify-content:center;box-shadow:0 -4px 16px rgba(0,0,0,.08);}
#mergebar span{font-size:14px;}
#movepick{display:none;position:fixed;inset:0;background:rgba(20,18,16,.5);z-index:80;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;}
.mp-panel{background:var(--bg);max-width:520px;width:100%;border-radius:16px;padding:18px;}
.mp-head{display:flex;justify-content:space-between;align-items:center;font-weight:500;}
.mp-head button{border:0;background:transparent;font-size:18px;cursor:pointer;color:var(--ink);min-height:0;width:auto;padding:4px;}
#mpSearch{margin:12px 0;}
.mp-list{max-height:50vh;overflow-y:auto;}
.mp-item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;cursor:pointer;}
.mp-item:hover{background:var(--accent-soft);}
.mp-item img{width:42px;height:56px;object-fit:cover;border-radius:6px;background:#F1ECE3;flex:0 0 auto;}
.mp-meta{min-width:0;font-size:14px;line-height:1.4;}
.mp-sub{font-size:12px;color:var(--muted);}
</style></head><body>

<div id="login">
  <h1>Fashion Selection</h1><p>商品後台</p>
  <div class="card" style="border:1px solid var(--line);">
    <label>Email</label><input id="email" type="email" autocomplete="username">
    <label>密碼</label><input id="pw" type="password" autocomplete="current-password">
    <button class="btn btn-primary" id="loginBtn">登入</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div id="admin"><div class="wrap">
  <div class="top"><h1>商品管理</h1><button class="btn btn-ghost" id="logout">登出</button></div>
  <div class="toolbar">
    <button class="btn btn-primary" id="addBtn">＋ 新增商品</button>
    <input class="search" id="search" type="search" placeholder="搜尋 名稱 / 品牌 / 分類 / 敘述 / 貼文" aria-label="搜尋">
    <span class="count" id="count"></span>
  </div>
  <div class="cardgrid" id="grid"></div>
  <div id="sentinel" aria-hidden="true"></div>
  <input id="fileInput" type="file" accept="image/*" multiple style="display:none">
</div></div>

<div id="busy">處理中…</div>

<div id="pzoom">
  <img id="pzImg" src="" alt="">
  <div class="pz-bar">
    <span class="cur" id="pzCur"></span>
    <button class="btn btn-ghost" id="pzClose">關閉</button>
    <button class="btn btn-ghost" id="pzMove">移動到…</button>
    <button class="btn btn-primary" id="pzCover">設為封面</button>
  </div>
</div>

<div id="mergebar">
  <span id="mergeCount"></span>
  <button class="btn btn-ghost" id="mergeCancel">取消選取</button>
  <button class="btn btn-primary" id="mergeBtn">合併選取</button>
</div>

<div id="movepick"><div class="mp-panel">
  <div class="mp-head"><span>把這張照片移到哪件商品？</span><button id="mpClose">✕</button></div>
  <button class="btn btn-primary" id="mpNew" style="width:100%">＋ 移到新商品（單獨成一頁）</button>
  <input id="mpSearch" placeholder="搜尋商品 名稱 / 品牌 / 分類">
  <div class="mp-list" id="mpList"></div>
</div></div>

<script>
const SB_URL="https://faukrpoggrwmcmhdcjtn.supabase.co";
const SB_KEY="sb_publishable_mtIVnC0l5XfUxX_ozxskqg_sbkEwbzl";
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const CATS=["服飾","包款","配件","鞋款","錶款","珠寶","居家","3C"];
const GENDERS=[["女","女裝"],["男","男裝"],["中性","男女同款"]];
const $=id=>document.getElementById(id);
const busy=on=>{$("busy").style.display=on?"flex":"none";};
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
let products=[], view=[], rendered=0, newCounter=0, uploadTargetKey=null, selected=[];
const CHUNK=24;
const byKey=k=>products.find(p=>p._key===k);
const today=()=>new Date().toISOString().slice(0,10);
function recOf(p){return {name:(p.name||"").trim(),brand:(p.brand||"").trim()||"Unknown",category:p.category||CATS[0],gender:p.gender||"女",description:(p.description||"").trim(),partner_post:(p.partner_post||"").trim()||null,listing_date:(p.listing_date||today()).slice(0,10),images:p.images||[]};}

/* ---------- auth ---------- */
async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(session){showAdmin();}else{$("login").style.display="block";}
}
$("loginBtn").onclick=async()=>{
  $("loginErr").textContent="";busy(true);
  const {error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("pw").value});
  busy(false);
  if(error){$("loginErr").textContent="登入失敗："+error.message;return;}
  showAdmin();
};
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")$("loginBtn").click();});
$("logout").onclick=async()=>{await sb.auth.signOut();location.reload();};
function showAdmin(){$("login").style.display="none";$("admin").style.display="block";loadProducts();}

/* ---------- load ---------- */
async function loadProducts(){
  busy(true);
  const {data,error}=await sb.from("fs_products").select("*").order("listing_date",{ascending:false}).order("id",{ascending:false});
  busy(false);
  if(error){alert("讀取失敗："+error.message);return;}
  products=(data||[]).map(p=>({...p,_key:"id"+p.id,_dirty:false}));
  applyFilter();
}

/* ---------- card rendering ---------- */
function catOpts(cur){return CATS.map(c=>`<option${c===cur?" selected":""}>${c}</option>`).join("");}
function genderOpts(cur){return GENDERS.map(([v,t])=>`<option value="${v}"${v===cur?" selected":""}>${t}</option>`).join("");}
function cardHTML(p){const k=p._key;const brandVal=(p.brand&&p.brand!=="Unknown")?p.brand:"";
  return `<div class="card${p._dirty?" dirty":""}${selected.includes(k)?" selected":""}" id="card-${k}">
    <label class="selbox" title="選取以合併"><input type="checkbox" ${selected.includes(k)?"checked":""} onchange="toggleSel('${k}',this.checked)"></label>
    <div class="strip" id="strip-${k}"></div>
    <label>商品名稱</label><input id="name-${k}" value="${esc(p.name)}" oninput="updateField('${k}','name',this.value)">
    <div class="row2">
      <div><label>品牌</label><input id="brand-${k}" value="${esc(brandVal)}" oninput="updateField('${k}','brand',this.value)"></div>
      <div><label>上架日期</label><input type="date" id="date-${k}" value="${esc((p.listing_date||"").slice(0,10))}" onchange="updateField('${k}','listing_date',this.value)"></div>
    </div>
    <div class="row2">
      <div><label>分類</label><select id="cat-${k}" onchange="updateField('${k}','category',this.value)">${catOpts(p.category||CATS[0])}</select></div>
      <div><label>性別</label><select id="gender-${k}" onchange="updateField('${k}','gender',this.value)">${genderOpts(p.gender||"女")}</select></div>
    </div>
    <label>敘述</label><textarea id="desc-${k}" oninput="updateField('${k}','description',this.value)">${esc(p.description)}</textarea>
    <details class="pp"${p.partner_post?" open":""}><summary>夥伴原始貼文（前台不顯示）</summary>
      <textarea class="pp-ta" id="pp-${k}" placeholder="貼上夥伴(szwego)原始貼文內容…" oninput="updateField('${k}','partner_post',this.value)">${esc(p.partner_post)}</textarea>
    </details>
    <div class="cardbar">
      <button class="btn btn-danger" onclick="delCard('${k}')">刪除</button>
      <button class="btn btn-primary save" id="save-${k}" onclick="saveCard('${k}')"${p._dirty?"":" disabled"}>${p.id?"儲存":"新增"}</button>
    </div>
  </div>`;
}
function renderCardStrip(p){
  const el=$("strip-"+p._key);if(!el)return;
  const imgs=p.images||[];
  el.innerHTML=imgs.map((src,i)=>`<div class="ph ${i===0?"cover":""}">
      <img src="${src}" loading="lazy" onclick="openPhotoZoom('${p._key}',${i})">
      ${i===0?'<div class="cv">封面</div>':""}
      <button class="del" onclick="delPhoto('${p._key}',${i})">✕</button></div>`).join("")
    +`<div class="addph" onclick="addPhoto('${p._key}')">＋</div>`;
}

/* ---------- dirty / edit ---------- */
function markDirty(k){const p=byKey(k);if(!p)return;p._dirty=true;
  const c=$("card-"+k);if(c)c.classList.add("dirty");
  const b=$("save-"+k);if(b){b.disabled=false;b.textContent=p.id?"儲存":"新增";}}
window.updateField=(k,f,v)=>{const p=byKey(k);if(!p)return;p[f]=v;markDirty(k);};

/* ---------- photos ---------- */
window.setCover=(k,i)=>{const p=byKey(k);if(!p)return;const a=p.images;p.images=[a[i],...a.filter((_,x)=>x!==i)];renderCardStrip(p);markDirty(k);};
window.delPhoto=(k,i)=>{const p=byKey(k);if(!p)return;p.images.splice(i,1);renderCardStrip(p);markDirty(k);};
window.addPhoto=k=>{uploadTargetKey=k;$("fileInput").click();};
$("fileInput").onchange=async e=>{
  const files=[...e.target.files];e.target.value="";
  if(!files.length||!uploadTargetKey)return;
  const p=byKey(uploadTargetKey);if(!p)return;
  busy(true);
  try{for(const f of files){const url=await compressUpload(f);p.images.push(url);}}
  catch(err){alert("上傳失敗："+(err.message||err));}
  busy(false);renderCardStrip(p);markDirty(p._key);
};
function compressUpload(file){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const max=1000;let w=img.naturalWidth,h=img.naturalHeight;
      if(w>=h&&w>max){h=Math.round(h*max/w);w=max;}else if(h>w&&h>max){w=Math.round(w*max/h);h=max;}
      const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      c.toBlob(async blob=>{
        if(!blob){rej(new Error("圖片處理失敗"));return;}
        const path="up_"+Date.now()+"_"+Math.random().toString(36).slice(2,7)+".jpg";
        const {error}=await sb.storage.from("products").upload(path,blob,{contentType:"image/jpeg",upsert:true});
        if(error){rej(error);return;}
        res(sb.storage.from("products").getPublicUrl(path).data.publicUrl);
      },"image/jpeg",0.72);
    };
    img.onerror=()=>rej(new Error("無法讀取圖片"));
    img.src=URL.createObjectURL(file);
  });
}

/* ---------- photo zoom ---------- */
let zoom={k:null,i:-1};
window.openPhotoZoom=(k,i)=>{const p=byKey(k);if(!p||!p.images[i])return;zoom={k,i};
  $("pzImg").src=p.images[i];
  $("pzCur").textContent="第 "+(i+1)+" / "+p.images.length+" 張"+(i===0?"（目前封面）":"");
  $("pzCover").style.display=i===0?"none":"";
  $("pzoom").style.display="flex";};
function closeZoom(){$("pzoom").style.display="none";zoom={k:null,i:-1};}
$("pzClose").onclick=closeZoom;
$("pzCover").onclick=()=>{if(zoom.k==null)return;setCover(zoom.k,zoom.i);closeZoom();};
$("pzoom").onclick=e=>{if(e.target===$("pzoom"))closeZoom();};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("pzoom").style.display==="flex")closeZoom();});

/* ---------- save / delete / add ---------- */
window.saveCard=async k=>{const p=byKey(k);if(!p)return;
  if(!p.images||!p.images.length){alert("請至少上傳一張照片。");return;}
  const rec={
    name:(p.name||"").trim(),
    brand:(p.brand||"").trim()||"Unknown",
    category:p.category||CATS[0],
    gender:p.gender||"女",
    description:(p.description||"").trim(),
    partner_post:(p.partner_post||"").trim()||null,
    listing_date:(p.listing_date||new Date().toISOString().slice(0,10)).slice(0,10),
    images:p.images
  };
  const b=$("save-"+k);if(b){b.disabled=true;b.textContent="儲存中…";}
  let error;
  if(p.id){({error}=await sb.from("fs_products").update(rec).eq("id",p.id));}
  else{const {data,error:e2}=await sb.from("fs_products").insert(rec).select("id").single();error=e2;if(!error&&data)p.id=data.id;}
  if(error){alert("儲存失敗："+error.message);if(b){b.disabled=false;b.textContent=p.id?"儲存":"新增";}return;}
  p._dirty=false;
  const c=$("card-"+k);if(c)c.classList.remove("dirty");
  if(b){b.textContent="✓ 已儲存";setTimeout(()=>{if(!p._dirty&&b){b.textContent="儲存";b.disabled=true;}},1500);}
};
window.delCard=async k=>{const p=byKey(k);if(!p)return;
  if(p.id){
    if(!confirm("確定刪除這件商品？此動作無法復原。"))return;
    busy(true);const {error}=await sb.from("fs_products").delete().eq("id",p.id);busy(false);
    if(error){alert("刪除失敗："+error.message);return;}
  }
  products=products.filter(x=>x!==p);view=view.filter(x=>x!==p);
  const c=$("card-"+k);if(c)c.remove();
  $("count").textContent=products.length+" 件";
};
$("addBtn").onclick=()=>{
  const p={_key:"new"+(++newCounter),id:null,images:[],name:"",brand:"",category:CATS[0],gender:"女",
    description:"",partner_post:"",listing_date:new Date().toISOString().slice(0,10),_dirty:true};
  products.unshift(p);view.unshift(p);
  $("grid").insertAdjacentHTML("afterbegin",cardHTML(p));renderCardStrip(p);
  window.scrollTo({top:0,behavior:"smooth"});
  const nm=$("name-"+p._key);if(nm)nm.focus();
};

/* ---------- search + chunked render ---------- */
const grid=$("grid"),sentinel=$("sentinel"),search=$("search");
function applyFilter(){
  const q=(search.value||"").trim().toLowerCase();
  view=q?products.filter(p=>((p.name||"")+" "+(p.brand||"")+" "+(p.category||"")+" "+(p.description||"")+" "+(p.partner_post||"")).toLowerCase().includes(q)):products.slice();
  rendered=0;grid.innerHTML="";appendChunk();
  $("count").textContent=view.length+" 件"+(q?"（共 "+products.length+"）":"");
}
function appendChunk(){
  const slice=view.slice(rendered,rendered+CHUNK);if(!slice.length)return;
  grid.insertAdjacentHTML("beforeend",slice.map(cardHTML).join(""));
  slice.forEach(renderCardStrip);
  rendered+=slice.length;
}
new IntersectionObserver(es=>{if(es[0].isIntersecting)appendChunk();},{rootMargin:"700px"}).observe(sentinel);
let _st;search.oninput=()=>{clearTimeout(_st);_st=setTimeout(applyFilter,150);};

/* ---------- merge (multi-select) ---------- */
window.toggleSel=(k,on)=>{
  const i=selected.indexOf(k);
  if(on){if(i<0)selected.push(k);}else{if(i>=0)selected.splice(i,1);}
  const c=$("card-"+k);if(c)c.classList.toggle("selected",on);
  updateMergeBar();
};
function updateMergeBar(){
  const bar=$("mergebar");
  if(!selected.length){bar.style.display="none";return;}
  bar.style.display="flex";
  $("mergeCount").textContent="已選 "+selected.length+" 件";
  $("mergeBtn").disabled=selected.length<2;
}
$("mergeCancel").onclick=()=>{
  document.querySelectorAll(".card.selected").forEach(c=>{c.classList.remove("selected");const cb=c.querySelector(".selbox input");if(cb)cb.checked=false;});
  selected=[];updateMergeBar();
};
$("mergeBtn").onclick=async()=>{
  if(selected.length<2)return;
  const keys=selected.slice();
  const prim=byKey(keys[0]); if(!prim){alert("找不到主商品");return;}
  const others=keys.slice(1).map(byKey).filter(Boolean);
  const nm=prim.name||"（未命名）";
  if(!confirm("把這 "+keys.length+" 件合併成 1 件？\n\n主商品（保留名稱/品牌/敘述）：「"+nm+"」\n其餘 "+others.length+" 件的照片會併入主商品，然後刪除。\n\n此動作無法復原。"))return;
  busy(true);
  prim.images=prim.images||[];
  const seen=new Set(prim.images);
  others.forEach(o=>(o.images||[]).forEach(u=>{if(!seen.has(u)){seen.add(u);prim.images.push(u);}}));
  let err=null;
  if(prim.id){const r=await sb.from("fs_products").update(recOf(prim)).eq("id",prim.id);err=r.error;}
  else{const r=await sb.from("fs_products").insert(recOf(prim)).select("id").single();err=r.error;if(!err&&r.data)prim.id=r.data.id;}
  if(err){busy(false);alert("合併失敗（更新主商品）："+err.message);return;}
  const delIds=others.filter(o=>o.id).map(o=>o.id);
  if(delIds.length){const r=await sb.from("fs_products").delete().in("id",delIds);if(r.error){busy(false);alert("合併失敗（刪除其餘）："+r.error.message);return;}}
  busy(false);
  const delSet=new Set(others);
  products=products.filter(p=>!delSet.has(p));
  prim._dirty=false;
  selected=[];updateMergeBar();
  applyFilter();
  alert("已合併成 1 件，共 "+prim.images.length+" 張照片。");
};

/* ---------- move a photo to another / new product ---------- */
$("pzMove").onclick=()=>{if(zoom.k==null)return;openMovePick();};
function openMovePick(){const src=byKey(zoom.k);if(!src||!src.id){alert("請先按「儲存」建立這件商品，再移動照片。");return;}renderMoveList("");$("mpSearch").value="";$("movepick").style.display="flex";setTimeout(()=>$("mpSearch").focus(),50);}
function closeMovePick(){$("movepick").style.display="none";}
function renderMoveList(q){
  q=(q||"").trim().toLowerCase();
  let list=products.filter(p=>p._key!==zoom.k&&p.id);
  if(q)list=list.filter(p=>((p.name||"")+" "+(p.brand||"")+" "+(p.category||"")).toLowerCase().includes(q));
  list=list.slice(0,60);
  $("mpList").innerHTML=list.map(p=>`<div class="mp-item" onclick="moveImageTo('${p._key}')">
      <img src="${(p.images||[])[0]||""}" alt="">
      <div class="mp-meta"><div>${esc(p.name)||"（未命名）"}</div>
        <div class="mp-sub">${esc(p.brand==="Unknown"?"未標品牌":(p.brand||""))} · ${esc(p.category||"")} · ${(p.images||[]).length}張</div></div>
    </div>`).join("")||'<p style="color:var(--muted);padding:10px">找不到符合的商品</p>';
}
$("mpSearch").oninput=()=>renderMoveList($("mpSearch").value);
$("mpClose").onclick=closeMovePick;
$("movepick").onclick=e=>{if(e.target===$("movepick"))closeMovePick();};
window.moveImageTo=async targetKey=>{
  const src=byKey(zoom.k), tgt=byKey(targetKey);
  if(!src||!tgt||!src.id||!tgt.id)return;
  const i=zoom.i, url=src.images[i];
  if(!url)return;
  busy(true);
  tgt.images=tgt.images||[];tgt.images.push(url);
  src.images.splice(i,1);
  let err=(await sb.from("fs_products").update({images:tgt.images}).eq("id",tgt.id)).error
       || (await sb.from("fs_products").update({images:src.images}).eq("id",src.id)).error;
  busy(false);
  if(err){alert("移動失敗："+err.message);return;}
  renderCardStrip(src);if($("strip-"+targetKey))renderCardStrip(tgt);
  closeMovePick();closeZoom();
  if(!src.images.length&&confirm("這件商品已經沒有照片了，要一併刪除嗎？")){delCard(src._key);}
};
$("mpNew").onclick=async()=>{
  const src=byKey(zoom.k);if(!src||!src.id)return;
  const i=zoom.i, url=src.images[i];if(!url)return;
  busy(true);
  const rec={name:"",brand:"Unknown",category:src.category||CATS[0],gender:src.gender||"女",description:"",partner_post:null,listing_date:(src.listing_date||today()).slice(0,10),images:[url]};
  const {data,error}=await sb.from("fs_products").insert(rec).select("*").single();
  if(error){busy(false);alert("建立新商品失敗："+error.message);return;}
  src.images.splice(i,1);
  const r2=await sb.from("fs_products").update({images:src.images}).eq("id",src.id);
  busy(false);
  if(r2.error){alert("已建立新商品，但更新原商品失敗："+r2.error.message);}
  products.unshift({...data,_key:"id"+data.id,_dirty:false});
  closeMovePick();closeZoom();
  applyFilter();
  if(!src.images.length)alert("已移到新商品。原商品已無照片，建議檢查是否刪除。");
};

start();
</script></body></html>
