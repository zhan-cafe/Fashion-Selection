<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#efede6">
<title>Fashion Selection</title>
<!-- icon（2b 鈕扣）。favicon.ico 另外放一份在根目錄，
     瀏覽器沒看到 link 也會自己去要 /favicon.ico。 -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Fashion Selection">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ──────────────────────────────────────────────────────────────
   Fashion Selection 前台 — v2「葉紋」
   設計稿：design_handoff_fashion_selection_v2_leaf（2a 商品牆 / 2b 詳情頁）
   使用者：40 歲以上、幾乎都用手機 → 字級一律不小於設計稿，
          所有可點元素 ≥ 44px，單欄大圖，一眼看得到「今天幾件、看到哪了」。
   ────────────────────────────────────────────────────────────── */
:root{
  --bg:#efede6;          --surface:#fcfbf8;
  --surface-2:#f6f5f0;   --surface-3:#f4f4ee;
  --beige-deep:#e2e2d6;  --neutral-soft:#e8e7df;
  --track:#dcdbd0;
  --ph-1:#d6d6ca;        --ph-2:#bbbcae;      --ph-3:#9c9d8c;
  --accent:#2f6a36;      --accent-hover:#25562b;
  --accent-ink:#285c2e;  --accent-soft:#dfeacf;
  --accent-softer:#f0f5e7;--accent-line:#bcd3a6;
  --accent2-bg:#ebedc8;  --accent2-ink:#4b5120;  --accent2-solid:#6f7a3a; --accent2-on:#f1f3d6;
  --ink:#1f221c;         --ink-2:#42453a;     --ink-3:#5c5f50;
  --ink-4:#7a7d6a;       --ink-5:#9fa290;     --ink-dis:#c0c2b3;
  --line:rgba(31,34,28,.09);
  --line-2:rgba(31,34,28,.14);
  --line-3:rgba(31,34,28,.16);
  --shadow-card:0 3px 10px rgba(40,44,34,.13);
  --shadow-sheet:0 -12px 32px rgba(40,44,34,.2);
  --sans:"Noto Sans TC","Figtree",-apple-system,system-ui,"Segoe UI",sans-serif;
  --display:"Caprasimo",Georgia,serif;
  /* 導覽列高度 = 按鈕 66px + 底部安全區。
     原本還外加 22px，iPhone 上變成 66+34+22，按鈕下面多出一條空白，
     看起來沒有貼齊螢幕底部。安全區本身就是要留的距離，不必再加。 */
  --navh:calc(66px + max(8px, env(safe-area-inset-bottom,0px)));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;overflow:hidden;}
html{-webkit-text-size-adjust:100%;}
body{
  color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  background:linear-gradient(rgba(239,237,230,.5),rgba(239,237,230,.5)),
             var(--bg) url(assets/leaf-wallpaper-sm.webp) center top / cover no-repeat;
}
@media(min-width:760px){
  body{background-image:linear-gradient(rgba(239,237,230,.5),rgba(239,237,230,.5)),url(assets/leaf-wallpaper.webp);}
}
/* 不支援 webp 的舊機退回 jpg */
.no-webp body{background-image:linear-gradient(rgba(239,237,230,.5),rgba(239,237,230,.5)),url(assets/leaf-wallpaper-sm.jpg);}
@media(min-width:760px){.no-webp body{background-image:linear-gradient(rgba(239,237,230,.5),rgba(239,237,230,.5)),url(assets/leaf-wallpaper.jpg);}}

button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{border:0;background:transparent;cursor:pointer;padding:0;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important;}}

/* ── 外框：手機是單欄；桌機（≥960px）改成側欄＋多欄商品牆 ── */
#app{position:fixed;inset:0;max-width:600px;margin:0 auto;
     box-shadow:0 0 0 1px var(--line);background:transparent;}
@media(min-width:601px) and (max-width:959px){#app{box-shadow:0 0 40px rgba(40,44,34,.1);}}
#sidebar{display:none;}
#dCard,#dMedia{display:contents;}   /* 手機版當作不存在，桌機才變成卡片與左欄 */

/* ── 主捲動容器（詳情覆蓋時這個容器不動，捲動位置自然保留）── */
#scroller{height:100%;overflow-y:auto;overscroll-behavior:contain;
          -webkit-overflow-scrolling:touch;padding-bottom:var(--navh);}

/* ── 頂部黏性列：日期膠囊 + 進度條 ────────────────────────── */
#topbar{position:sticky;top:0;z-index:5;
  background-color:var(--bg);   /* 背景圖由 syncTopbarBg() 依視窗算好，與商品牆同一張 */
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);}
#brandline{display:flex;align-items:baseline;justify-content:space-between;padding:10px 16px 0;}
#brandline b{font-family:var(--display);font-size:19px;font-weight:400;letter-spacing:.01em;}
#brandline span{font-size:11.5px;letter-spacing:.18em;color:var(--ink-4);}
#pills{display:flex;gap:9px;overflow-x:auto;padding:8px 14px 10px;scrollbar-width:none;}
#pills::-webkit-scrollbar{display:none;}
.pill{flex:0 0 auto;white-space:nowrap;min-width:78px;min-height:60px;padding:6px 14px;
  border:1px solid var(--line-2);border-radius:22px;background:var(--surface);color:var(--ink-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;}
.pill b{font-size:18px;font-weight:700;}
.pill s{font-size:11px;opacity:.75;text-decoration:none;}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;}
#progress{height:5px;background:var(--track);}
#progressFill{height:100%;background:var(--accent);width:0;transition:width .3s ease-out;}

/* ── 標題列 ───────────────────────────────────────────────── */
#titlebar{padding:16px 18px 2px;}
#dayTitle{font-size:19px;font-weight:700;line-height:1.35;}
#seenLabel{font-size:13.5px;color:var(--ink-3);margin-top:2px;}
#seenLabel:empty{display:none;}

/* ── 商品卡 ───────────────────────────────────────────────── */
#list{display:flex;flex-direction:column;gap:20px;padding:14px 14px 0;}
.card{background:var(--surface);border-radius:28px;overflow:hidden;box-shadow:var(--shadow-card);}
.big{position:relative;aspect-ratio:4/5;background:var(--ph-1);cursor:pointer;display:block;width:100%;}
.big img{width:100%;height:100%;object-fit:cover;display:block;}
.badge{position:absolute;top:12px;left:12px;color:#fff;font-size:12.5px;padding:4px 13px;
  border-radius:999px;letter-spacing:.05em;}
.b-new{background:var(--accent);}.b-week{background:var(--accent2-solid);}.b-month{background:var(--ph-3);}
.fav{position:absolute;top:6px;right:6px;width:52px;height:52px;display:grid;place-items:center;}
.fav svg{width:29px;height:29px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.32));}
.counter{position:absolute;bottom:12px;right:12px;background:rgba(31,34,28,.72);color:#fff;
  font-size:12.5px;padding:4px 12px;border-radius:999px;letter-spacing:.04em;}
.thumbs{display:flex;gap:7px;padding:10px 14px 0;}
/* 高度寫死、圖片用絕對定位填滿。
   原本是 flex:1 + aspect-ratio:1 + max-height 三個疊在一起——Chrome 算得出來，
   但 iOS Safari 會把高度算成 aspect-ratio 的值再被 max-height 裁掉，
   圖片就只露出一截、上面留一大塊灰底。改成不依賴 aspect-ratio 就不會有歧義。 */
.thumbs button{flex:1;min-width:0;height:76px;position:relative;border:2.5px solid rgba(31,34,28,.1);
  border-radius:14px;background:var(--ph-1);overflow:hidden;display:grid;place-items:center;
  font-size:15px;font-weight:700;color:var(--ink);}
.thumbs button[aria-pressed="true"]{border-color:var(--accent);}
.thumbs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
.info{padding:12px 18px 18px;cursor:pointer;}
.info .brand{font-size:12.5px;letter-spacing:.16em;color:var(--ink-2);text-transform:uppercase;}
.info .name{font-size:17px;line-height:1.4;margin-top:3px;font-weight:500;}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 8px;}
.tag{font-size:12.5px;padding:3px 11px;border-radius:8px;background:var(--accent2-bg);color:var(--accent2-ink);}
.tag-f{background:var(--accent-soft);color:var(--accent-ink);}
.tag-m{background:var(--accent2-bg);color:var(--accent2-ink);}
.tag-u{background:var(--neutral-soft);color:var(--ink-3);}
.info .desc{font-size:14px;line-height:1.65;color:var(--ink-3);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.info .meta{font-size:13px;color:var(--ink-3);margin-top:10px;}

/* 骨架（載入中） */
.skel{background:var(--surface);border-radius:28px;overflow:hidden;box-shadow:var(--shadow-card);}
.skel .sk-img{aspect-ratio:4/5;background:var(--beige-deep);}
.skel .sk-txt{height:14px;margin:14px 18px;border-radius:7px;background:var(--beige-deep);}
.skel .sk-txt.s{width:40%;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.skel>*{animation:pulse 1.4s ease-in-out infinite;}

/* ── 完成卡片 ─────────────────────────────────────────────── */
#donewrap{padding:28px 18px 30px;}
#donecard{border-radius:28px;padding:24px 20px;text-align:center;
  background:var(--surface-2);border:1px solid rgba(31,34,28,.1);}
#donecard.all{background:var(--accent2-bg);border-color:rgba(75,81,32,.22);}
#doneMsg{font-size:16.5px;font-weight:500;line-height:1.6;color:var(--ink-3);}
#donecard.all #doneMsg{color:var(--accent2-ink);}
.btn-main{width:100%;min-height:54px;margin-top:16px;border-radius:999px;
  background:var(--accent);color:#fff;font-size:16px;font-weight:500;}
.btn-sub{width:100%;min-height:50px;margin-top:9px;border:1px solid var(--line-3);border-radius:999px;
  background:var(--surface);color:var(--ink);font-size:15px;}
#emptyMsg{margin:28px 18px;padding:44px 24px;text-align:center;color:var(--ink-3);line-height:1.9;font-size:15.5px;
  background:var(--surface-2);border:1px solid rgba(31,34,28,.1);border-radius:28px;}

/* ── 底部導覽列 ───────────────────────────────────────────── */
#bottomnav{position:absolute;left:0;right:0;bottom:0;z-index:12;
  display:grid;grid-template-columns:1fr 1fr 1fr;
  /* 底色就是按鈕的顏色，安全區那一條才不會露出別的色塊；
     格線改用 border-left 畫，不用 gap + 底色的做法。 */
  background:var(--surface-2);border-top:1px solid rgba(31,34,28,.1);
  padding-bottom:max(8px, env(safe-area-inset-bottom,0px));
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
#bottomnav button{min-height:66px;background:transparent;color:var(--ink-2);
  font-size:13.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;}
#bottomnav button+button{border-left:1px solid rgba(31,34,28,.1);}
#bottomnav svg{width:21px;height:21px;}
#bottomnav button.on{background:var(--beige-deep);color:var(--accent-ink);}
#navFav.on{background:var(--accent-soft);color:var(--accent-ink);}
#navFil.on{color:var(--accent-ink);background:var(--accent-softer);}
#navFil span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px;}

/* ── 底部彈出 sheet ───────────────────────────────────────── */
.sheet{position:absolute;inset:0;z-index:30;background:rgba(31,34,28,.42);
  display:flex;flex-direction:column;justify-content:flex-end;}
.sheet[hidden]{display:none;}
.sheet .scrim{flex:1;}
.sheet .panel{background:var(--surface-2);border-radius:28px 28px 0 0;
  box-shadow:var(--shadow-sheet);max-height:88%;overflow-y:auto;
  animation:slideUp .22s ease-out;}
@keyframes slideUp{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.sheet-head h2{font-size:17px;font-weight:700;margin:0;}
.sheet-x{width:44px;height:44px;border:1px solid var(--line-2);border-radius:50%;
  background:var(--surface);font-size:17px;color:var(--ink);}
.sub-label{font-size:12px;letter-spacing:.12em;color:var(--ink-4);}

/* 月曆 */
#calPanel{padding:18px 18px calc(34px + env(safe-area-inset-bottom,0px));}
.cal-nav{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px;}
.cal-nav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);
  background:var(--surface);font-size:18px;color:var(--ink);}
.cal-nav span{font-size:15px;font-weight:500;min-width:120px;text-align:center;}
#calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-wd{text-align:center;font-size:11px;color:var(--ink-4);padding:2px 0;}
.cal-day{position:relative;aspect-ratio:1;border:1px solid transparent;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ph-2);}
.cal-day.has{background:var(--accent2-bg);color:var(--accent2-ink);border-color:rgba(75,81,32,.18);}
.cal-day.sel{background:var(--accent);color:#fff;border-color:var(--accent);}
.cal-day em{font-size:14px;line-height:1.1;font-style:normal;}
.cal-day s{font-size:9px;opacity:.8;line-height:1.2;text-decoration:none;}
.cal-day i{position:absolute;top:2px;right:4px;font-size:9px;font-style:normal;}

/* 篩選 */
#filPanel{padding:18px 18px calc(30px + env(safe-area-inset-bottom,0px));}
#searchBox{position:relative;margin-bottom:16px;}
#searchBox input{width:100%;min-height:52px;padding:0 44px 0 16px;border:1px solid var(--line-3);
  border-radius:999px;background:var(--surface);font-size:16px;}
#searchBox input::placeholder{color:var(--ink-5);}
#searchClear{position:absolute;right:6px;top:4px;width:44px;height:44px;border-radius:50%;
  font-size:17px;color:var(--ink-4);}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.cat-grid button{min-height:52px;border:1px solid var(--line-2);border-radius:16px;
  background:var(--surface);color:var(--ink);font-size:15.5px;}
.cat-grid button[aria-pressed="true"]{background:var(--accent2-solid);border-color:var(--accent2-solid);color:var(--accent2-on);}
.gender-row{display:flex;gap:8px;}
.gender-row button{flex:1;min-height:50px;border:1px solid var(--line-2);border-radius:999px;
  background:var(--surface);color:var(--ink);font-size:15px;}
.gender-row button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;}
/* 品牌依字首分行：左邊字母、右邊品牌自動換行，不橫向捲 */
#brandRow{display:flex;flex-direction:column;gap:8px;}
.b-row{display:flex;align-items:flex-start;gap:8px;}
.b-letter{flex:0 0 18px;line-height:44px;text-align:center;font-size:13px;font-weight:700;color:var(--ink-4);}
.b-chips{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:8px;}
#brandRow button{max-width:100%;min-height:44px;padding:0 14px;border:1px solid var(--line-2);
  border-radius:999px;background:var(--surface);color:var(--ink);font-size:14.5px;}
#brandRow button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;}
/* 品牌清單變長，按鈕要黏在面板底部，不用捲到最下面才按得到 */
#filApply{position:sticky;bottom:0;width:100%;min-height:56px;margin-top:20px;border-radius:999px;
  background:var(--accent);color:#fff;font-size:16.5px;font-weight:500;box-shadow:0 6px 18px rgba(31,34,28,.28);}

/* ── 商品詳情（覆蓋層，底層列表不卸載）───────────────────── */
#detail{position:absolute;inset:0;z-index:40;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  background:linear-gradient(rgba(239,237,230,.5),rgba(239,237,230,.5)),
             var(--bg) url(assets/leaf-wallpaper-sm.webp) center top / cover no-repeat;
  animation:fadeIn .16s ease-out;}
@media(min-width:760px){#detail{background-image:linear-gradient(rgba(239,237,230,.5),rgba(239,237,230,.5)),url(assets/leaf-wallpaper.webp);}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#detail[hidden]{display:none;}
#dBack{position:sticky;top:0;z-index:3;background:rgba(239,237,230,.96);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(31,34,28,.1);padding-top:env(safe-area-inset-top,0px);}
#dBack button{display:flex;align-items:center;gap:8px;width:100%;min-height:56px;padding:0 14px;
  font-size:17px;font-weight:500;color:var(--ink);text-align:left;}
#dMain{position:relative;aspect-ratio:3/4;background:var(--ph-1);cursor:zoom-in;display:block;width:100%;}
#dMain img{width:100%;height:100%;object-fit:cover;display:block;}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;
  background:rgba(252,251,248,.92);box-shadow:0 2px 8px rgba(40,44,34,.2);display:grid;place-items:center;}
#dPrev{left:10px;}#dNext{right:10px;}
.gnav[disabled]{opacity:.25;}
#dCount{position:absolute;top:12px;right:12px;background:rgba(31,34,28,.72);color:#fff;
  font-size:13px;padding:4px 12px;border-radius:999px;letter-spacing:.04em;}
#dZoomHint{position:absolute;bottom:12px;right:12px;display:flex;align-items:center;gap:5px;
  background:rgba(252,251,248,.9);color:var(--ink-2);font-size:12px;padding:4px 11px;border-radius:999px;}
#dThumbs{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 4px;scrollbar-width:none;}
#dThumbs::-webkit-scrollbar{display:none;}
#dThumbs button{flex:0 0 auto;width:66px;height:66px;position:relative;border:2.5px solid rgba(31,34,28,.12);
  border-radius:14px;overflow:hidden;background:var(--ph-1);opacity:.7;}
#dThumbs button[aria-pressed="true"]{border-color:var(--accent);opacity:1;}
#dThumbs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
/* 文字區要墊一層不透明面。葉紋在這個高度剛好是深綠的葉叢，
   直接把字壓在上面對比不到 4.5:1，40 歲以上的眼睛會很吃力。
   墊成一張由下往上的紙，壁紙仍然從圖片區與邊緣露出來。 */
#dInfo{padding:18px 22px calc(44px + env(safe-area-inset-bottom,0px));
  background:var(--surface);border-radius:26px 26px 0 0;margin-top:10px;
  box-shadow:0 -6px 20px rgba(40,44,34,.1);min-height:60vh;}
#dId{font-size:13px;letter-spacing:.1em;color:var(--ink-4);}
#dBrand{font-size:13px;letter-spacing:.16em;color:var(--accent-ink);text-transform:uppercase;margin-top:12px;}
#dName{margin:5px 0 10px;font-family:var(--display);font-weight:400;font-size:25px;line-height:1.25;}
#dTags{display:flex;gap:6px;margin-bottom:16px;}
#dTags .tag{font-size:13px;padding:4px 12px;}
#dDesc{font-size:16px;line-height:1.9;white-space:pre-line;margin:0;}
#dDate{font-size:13.5px;color:var(--ink-4);margin-top:20px;}
#dBtns{display:flex;gap:10px;margin-top:22px;}
#dFav{flex:0 0 auto;min-height:56px;padding:0 20px;border:1px solid var(--line-3);border-radius:999px;
  background:var(--surface);color:var(--ink);font-size:16px;display:flex;align-items:center;gap:8px;}
#dFav.on{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-line);}
#dCopy{flex:1;min-height:56px;border-radius:999px;background:var(--accent);color:#fff;font-size:16px;font-weight:500;}
#dCopy:disabled{background:var(--accent2-solid);}

/* ── 放大檢視 ─────────────────────────────────────────────── */
#zoomview{position:absolute;inset:0;z-index:60;background:#141211;display:flex;flex-direction:column;}
#zoomview[hidden]{display:none;}
#zTop{display:flex;align-items:center;justify-content:space-between;
  padding:calc(12px + env(safe-area-inset-top,0px)) 12px 0;}
#zCount{color:#fff;font-size:15px;padding:0 8px;}
#zClose{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:20px;}
#zBody{flex:1;display:grid;place-items:center;position:relative;overflow:auto;touch-action:pinch-zoom;}
#zImg{max-width:100%;max-height:100%;object-fit:contain;display:block;}
.znav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;
  background:rgba(255,255,255,.16);display:grid;place-items:center;}
#zPrev{left:10px;}#zNext{right:10px;}
.znav[disabled]{opacity:.25;}
#zHint{text-align:center;font-size:13px;color:rgba(255,255,255,.6);
  padding:10px 0 calc(16px + env(safe-area-inset-bottom,0px));}

/* ── Toast ────────────────────────────────────────────────── */
/* ══════════════════════════════════════════════════════════════
   桌機版（≥960px）
   手機是「一次一件、拇指操作」；桌機螢幕寬、用滑鼠，
   所以改成「左側常駐篩選 ＋ 右側多欄商品牆」，
   底部導覽列拿掉（它的三個功能在桌機都已經常駐可見）。
   DOM 不變，只有月曆／篩選面板會被 layout() 搬進側欄。
   ══════════════════════════════════════════════════════════════ */
@media(min-width:960px){
  #app{position:static;max-width:none;box-shadow:none;}
  html,body{height:auto;overflow:visible;}
  #scroller{height:auto;overflow:visible;padding-bottom:60px;}

  #topbar{padding-top:0;}
  #brandline{max-width:1680px;margin:0 auto;padding:14px 28px 0;}
  #brandline b{font-size:23px;}
  #pills{max-width:1680px;margin:0 auto;padding:10px 28px 12px;}
  .pill{min-width:92px;min-height:64px;}
  .pill b{font-size:19px;}

  #main{max-width:1680px;margin:0 auto;padding:0 28px;
        display:grid;grid-template-columns:272px minmax(0,1fr);gap:30px;align-items:start;}
  #sidebar{display:block;position:sticky;top:132px;max-height:calc(100vh - 150px);
           overflow-y:auto;padding:18px 0 24px;scrollbar-width:thin;}
  #sidebar>div{background:var(--surface);border:1px solid var(--line);border-radius:20px;
               margin-bottom:14px;overflow:hidden;}
  /* 被搬進來的面板：拿掉 sheet 的圓角與大留白，變成側欄區塊 */
  #sidebar #calPanel,#sidebar #filPanel{padding:16px 16px 18px;background:transparent;}
  #sidebar .sheet-x{display:none;}
  #sidebar .sheet-head{margin-bottom:10px;}
  #sidebar #filApply{display:none;}       /* 側欄是即時套用的，不需要「查看商品」 */
  /* 側欄窄，品牌清單限高自己捲，不要把下面的區塊推走 */
  #sidebar #brandRow{max-height:360px;overflow-y:auto;}
  #sidebar #brandRow button{min-height:40px;padding:0 12px;font-size:13.5px;}
  #sidebar .b-letter{line-height:40px;}
  #sidebar .cat-grid button{min-height:46px;font-size:14.5px;}
  #sidebar .gender-row button{min-height:44px;font-size:14px;}
  #sidebar #searchBox input{min-height:46px;font-size:15px;}
  #sidebar .cal-day em{font-size:12.5px;}
  #sidebar .cal-nav button{width:36px;height:36px;}
  #favBtn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
          min-height:54px;font-size:16px;color:var(--ink);}
  #favBtn.on{background:var(--accent-soft);color:var(--accent-ink);}
  #favBtn.on svg{fill:currentColor;}

  #titlebar{padding:22px 0 4px;}
  #dayTitle{font-size:23px;}
  #seenLabel{font-size:14px;}
  #list{padding:16px 0 0;display:grid;gap:22px;
        grid-template-columns:repeat(2,minmax(0,1fr));}
  .card{border-radius:22px;}
  .big{aspect-ratio:3/4;}
  .thumbs button{height:62px;}
  .info{padding:12px 16px 16px;}
  #donewrap{padding:28px 0 40px;}
  #emptyMsg{margin:28px 0;}
  #bottomnav{display:none;}
  /* 捲回頂端：桌機沒有底部導覽，改用右下角浮動鈕 */
  #toTop{position:fixed;right:26px;bottom:26px;z-index:20;width:52px;height:52px;border-radius:50%;
         background:var(--accent);color:#fff;font-size:22px;box-shadow:0 6px 20px rgba(40,44,34,.25);}
  #toTop[hidden]{display:none;}
}
@media(min-width:1320px){#list{grid-template-columns:repeat(3,minmax(0,1fr));}}
@media(min-width:1760px){#main{max-width:1920px;} #list{grid-template-columns:repeat(4,minmax(0,1fr));}}
@media(max-width:959px){#toTop{display:none;}}

/* 桌機的商品詳情：改成置中的對話框，左圖右文 */
@media(min-width:960px){
  #detail{position:fixed;inset:0;z-index:40;background:rgba(31,34,28,.55);
          backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
          display:grid;place-items:center;padding:36px;overflow:auto;}
  #dCard{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);
         grid-template-areas:"back back" "media info";
         width:min(1180px,100%);max-height:calc(100vh - 72px);
         background:var(--surface);border-radius:26px;overflow:hidden;
         box-shadow:0 24px 70px rgba(31,34,28,.4);}
  #dBack{grid-area:back;position:static;background:var(--surface-2);backdrop-filter:none;padding-top:0;}
  #dMedia{grid-area:media;display:block;overflow-y:auto;background:var(--surface-3);}
  #dMain{aspect-ratio:auto;height:auto;}
  #dMain img{width:100%;height:auto;max-height:66vh;object-fit:contain;background:var(--surface-3);}
  #dThumbs{padding:10px 14px 16px;flex-wrap:wrap;overflow:visible;}
  #dInfo{grid-area:info;overflow-y:auto;margin-top:0;border-radius:0;box-shadow:none;
         min-height:0;padding:26px 30px 34px;}
  #dName{font-size:27px;}
  /* #app 不再是定位容器，這幾層要自己改成 fixed 才會貼著視窗 */
  #zoomview{position:fixed;}
  #toast{position:fixed;bottom:28px;}
  .sheet{display:none!important;}      /* 桌機用側欄，不會用到底部彈出 */
}

#toast{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(var(--navh) + 16px);z-index:70;
  background:var(--accent);color:#fff;padding:12px 20px;border-radius:999px;
  font-size:14.5px;box-shadow:0 10px 28px rgba(40,44,34,.25);max-width:88%;text-align:center;}
#toast[hidden]{display:none;}
/* ── 篩選（設計版 2026-11-02）─────────────────────── */
#ranges{display:flex;gap:4px;margin:6px 14px 0;padding:4px;background:#e2e2d6;border-radius:999px;}
#ranges button{flex:1;min-height:48px;border:0;border-radius:999px;background:transparent;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;padding:0 4px;font-family:inherit;}
#ranges button[aria-pressed="true"]{background:var(--accent);color:#fff;}
.rg-n{font-size:15.5px;font-weight:700;}
.rg-c{font-size:11.5px;opacity:.85;}
#filSummary{display:flex;align-items:center;flex-wrap:wrap;gap:7px;padding:6px 10px 8px 14px;
  background:rgba(235,237,200,.82);border-top:1px solid rgba(75,81,32,.16);}
#filSummary[hidden]{display:none;}
.fs-title{display:flex;align-items:center;gap:5px;min-height:44px;padding:0 2px;border:0;background:none;
  color:#4b5120;font-family:inherit;font-size:14.5px;font-weight:700;}
.fs-chip{flex-shrink:0;white-space:nowrap;display:flex;align-items:center;gap:6px;min-height:44px;padding:0 10px 0 14px;
  border:1px solid rgba(75,81,32,.28);border-radius:999px;background:#fcfbf8;color:var(--ink);font-family:inherit;font-size:15px;}
.fs-clear{margin-left:auto;min-height:44px;padding:0 6px;border:0;background:none;color:#4b5120;font-family:inherit;
  font-size:14px;text-decoration:underline;text-underline-offset:3px;}
#navFil{position:relative;}
#navDot{position:absolute;top:12px;left:calc(50% + 8px);width:10px;height:10px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 0 2px var(--surface-2);}
#navDot[hidden]{display:none;}
.grp-head{display:flex;align-items:center;gap:8px;margin:22px 0 10px;min-height:44px;}
.grp-head>div{flex:1;min-width:0;}
.grp-t{font-size:18px;font-weight:700;}
.grp-s{font-size:13px;color:var(--ink-3);}
.grp-clr{min-height:44px;padding:0 14px;border:0;border-radius:999px;background:#e2e2d6;color:var(--ink);font-family:inherit;font-size:14px;}
.grp-clr[hidden]{display:none;}
.sub-h{font-size:13px;font-weight:700;color:#42453a;margin:14px 0 8px;}
.zero{opacity:.4;}
#itemGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
.it{min-height:82px;border:1px solid var(--line-2);border-radius:18px;background:var(--surface);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 2px;font-family:inherit;}
.it svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.75;stroke-linecap:round;stroke-linejoin:round;}
.it-n{font-size:15.5px;font-weight:500;line-height:1.2;}
.it-c{font-size:12px;line-height:1.1;opacity:.8;}
.it[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;}
#colorRow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;}
.sw{position:relative;display:flex;flex-direction:column;padding:0;border:0;border-radius:8px;overflow:hidden;
  background:#fcfbf8;color:var(--ink);font-family:inherit;text-align:left;box-shadow:0 0 0 1px rgba(31,34,28,.1),0 1px 3px rgba(40,44,34,.12);}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent),0 3px 10px rgba(40,44,34,.16);}
.sw i{display:block;aspect-ratio:5 / 4;}
.sw-t{display:flex;flex-direction:column;gap:1px;padding:6px 7px 8px;}
.sw-n{font-size:15px;font-weight:700;line-height:1.2;}
.sw-en{font-size:9.5px;letter-spacing:.14em;color:var(--ink-3);line-height:1.3;}
.sw-c{font-size:11.5px;color:#42453a;margin-top:2px;}
.sw-badge{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--accent);
  display:grid;place-items:center;box-shadow:0 0 0 2px #fcfbf8;}
.sw-badge svg{display:block;}
.seg{display:flex;gap:8px;}
.gbtn{flex:1;min-height:52px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);color:var(--ink);
  font-family:inherit;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:5px;}
.gbtn .gc{font-size:12px;opacity:.8;}
.gbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;}
#brandRow{display:flex;flex-direction:column;gap:10px;}
#brandRow .bg{display:flex;align-items:flex-start;gap:10px;}
.bg-l{flex:0 0 auto;width:36px;height:36px;margin-top:5px;border-radius:50%;background:#e2e2d6;color:#4b5120;
  display:grid;place-items:center;font-family:var(--display);font-size:17px;}
.bg-l.oth{font-size:11px;font-family:inherit;}
.bg-c{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:8px;}
#brandRow .bchip{min-height:46px;padding:0 15px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);
  color:var(--ink);font-family:inherit;font-size:14.5px;display:flex;align-items:center;gap:6px;}
#brandRow .bchip .bc{font-size:12px;opacity:.75;}
#brandRow .bchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;}
#filPanel .filter-foot{position:sticky;bottom:0;margin:0 -18px;padding:12px 18px calc(22px + env(safe-area-inset-bottom,0px));
  background:var(--surface-2);border-top:1px solid rgba(31,34,28,.1);display:flex;gap:10px;}
#filClear{flex:0 0 auto;min-height:56px;padding:0 20px;border:1px solid var(--line-3);border-radius:999px;
  background:var(--surface);color:var(--ink);font-family:inherit;font-size:15.5px;}
#filPanel #filApply{position:static;flex:1;margin:0;min-height:56px;border-radius:999px;background:var(--accent);
  color:#fff;font-size:16.5px;box-shadow:none;}
#filPanel #filApply.zero{opacity:1;background:#7a7d6a;}
.sheet-sub{font-size:13.5px;color:var(--ink-3);margin-top:5px;}
#emptyMsg.is-card{margin:14px 14px 0;padding:0;text-align:left;}
.empty-card{background:var(--surface);border-radius:28px;padding:26px 20px 20px;box-shadow:0 3px 10px rgba(40,44,34,.13);}
.empty-ico{width:72px;height:72px;border-radius:50%;background:#e2e2d6;display:grid;place-items:center;}
.empty-t{font-size:19px;font-weight:700;line-height:1.45;margin-top:14px;}
.empty-s{font-size:15px;line-height:1.7;color:#42453a;margin-top:4px;}
.sugs{display:flex;flex-direction:column;gap:9px;margin-top:14px;}
.sug{min-height:54px;padding:0 18px;border:1px solid rgba(31,34,28,.16);border-radius:999px;background:var(--surface-2);
  color:var(--ink);font-family:inherit;font-size:15.5px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;}
.sug b{flex:0 0 auto;color:var(--accent-ink);font-weight:700;}
.sug-main{min-height:56px;margin-top:4px;border:0;border-radius:999px;background:var(--accent);color:#fff;font-family:inherit;font-size:16.5px;}

.tag-col{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:3px 10px 3px 5px;border-radius:999px;
  background:var(--surface-2);border:1px solid rgba(31,34,28,.1);color:var(--ink);}
.tag-col i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(31,34,28,.22);display:block;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="app">
  <div id="scroller">
    <header id="topbar">
      <div id="brandline"><b>Fashion Selection</b></div>
      <div id="ranges" role="group" aria-label="依發佈日快速看"></div>
      <div id="pills"></div>
      <div id="filSummary" hidden></div>
  <div id="progress"><div id="progressFill"></div></div>
    </header>

    <div id="main">
      <!-- 桌機版的側欄。月曆與篩選面板會被 layout() 從底部 sheet 搬進來，
           手機版再搬回去——同一份 DOM，兩種版面，不必維護兩套。 -->
      <aside id="sidebar">
        <div id="sideFav"><button id="favBtn">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 21.3l-1.4-1.3C5.4 15.3 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.8-8.6 11.5L12 21.3z"></path></svg>
          <span>我的收藏</span></button></div>
        <div id="sideCal"></div>
        <div id="sideFil"></div>
      </aside>

      <div id="content">
        <div id="titlebar">
          <div id="dayTitle">載入中…</div>
          <div id="seenLabel"></div>
        </div>

        <div id="list"></div>
        <div id="sentinel" aria-hidden="true" style="height:1px"></div>
        <div id="emptyMsg" hidden></div>

        <div id="donewrap" hidden>
          <div id="donecard">
            <div id="doneMsg"></div>
            <button class="btn-main" id="btnNextDay"></button>
            <button class="btn-sub" id="btnTop">↑ 回到最上面</button>
          </div>
        </div>
      </div><!-- /#content -->
    </div><!-- /#main -->
  </div><!-- /#scroller -->

  <nav id="bottomnav">
    <button id="navCal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4M16 3v4M3 11h18"></path></svg>
      <span>日期</span>
    </button>
    <button id="navFav">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 21.3l-1.4-1.3C5.4 15.3 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.8-8.6 11.5L12 21.3z"></path></svg>
      <span>收藏</span>
    </button>
    <button id="navFil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
      <i id="navDot" hidden></i>
      <span id="filLabel">篩選</span>
    </button>
  </nav>

  <!-- 月曆 -->
  <div class="sheet" id="sheetCal" hidden>
    <div class="scrim" data-close></div>
    <div class="panel" id="calPanel">
      <div class="sheet-head"><h2>依日期看</h2><button class="sheet-x" data-close aria-label="關閉">✕</button></div>
      <div class="cal-nav">
        <button id="calPrev" aria-label="上個月">‹</button>
        <span id="calTitle"></span>
        <button id="calNext" aria-label="下個月">›</button>
      </div>
      <div id="calGrid"></div>
    </div>
  </div>

  <!-- 篩選 -->
  <div class="sheet" id="sheetFil" hidden>
    <div class="scrim" data-close></div>
    <div class="panel" id="filPanel">
      <div class="sheet-head"><div><h2>篩選</h2><div class="sheet-sub">條件會疊加：外套＋黑＝黑色外套</div></div><button class="sheet-x" data-close aria-label="關閉">✕</button></div>
      <div id="searchBox">
        <input id="search" type="search" placeholder="搜尋 編號 / 名稱 / 品牌" aria-label="搜尋商品" enterkeyhint="search">
        <button id="searchClear" hidden aria-label="清除">✕</button>
      </div>
      <div class="grp-head"><div><div class="grp-t">品項</div><div class="grp-s">上衣＝襯衫、T 恤、毛衣、針織</div></div><button class="grp-clr" data-clr="item" hidden>清除</button></div>
      <div id="itemGrid"></div>
      <div class="grp-head"><div><div class="grp-t">顏色</div><div class="grp-s">一件衣服有兩個顏色，兩個色都找得到它</div></div><button class="grp-clr" data-clr="color" hidden>清除</button></div>

      <div id="genderRow" class="seg"></div>
      <div class="grp-head"><div><div class="grp-t">品牌</div><div class="grp-s">只列出這段日期有上架的品牌</div></div><button class="grp-clr" data-clr="brand" hidden>清除</button></div>
      <div id="brandRow"></div>
      <div class="filter-foot"><button id="filClear">全部清除</button><button id="filApply">查看商品</button></div>
    </div>
  </div>

  <!-- 商品詳情 -->
  <div id="detail" hidden role="dialog" aria-modal="true" aria-label="商品詳情">
   <div id="dCard">
    <div id="dBack"><button id="dBackBtn">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#2f6a36" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      <span id="dBackLabel">返回</span>

    <div id="dMedia">

      <button class="gnav" id="dNext" aria-label="下一張"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#1f221c" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>
      <span id="dCount"></span>
      <span id="dZoomHint">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"></path></svg>
        點圖放大
      </span>
    </div>
    <div id="dThumbs"></div>
    </div><!-- /#dMedia -->
    <div id="dInfo">
      <div id="dId"></div>
      <div id="dBrand"></div>
      <h2 id="dName"></h2>
      <div id="dTags"></div>
      <p id="dDesc"></p>
      <div id="dDate"></div>
      <div id="dBtns">
        <button id="dFav"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21.3l-1.4-1.3C5.4 15.3 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.8-8.6 11.5L12 21.3z"></path></svg><span id="dFavLabel">收藏</span></button>
        <button id="dCopy">複製商品連結</button>
      </div>
    </div>
   </div><!-- /#dCard -->
  </div>

  <!-- 放大檢視 -->
  <div id="zoomview" hidden role="dialog" aria-modal="true" aria-label="放大檢視">
    <div id="zTop"><span id="zCount"></span><button id="zClose" aria-label="關閉">✕</button></div>
    <div id="zBody">
      <img id="zImg" alt="">
      <button class="znav" id="zPrev" aria-label="上一張"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button>
      <button class="znav" id="zNext" aria-label="下一張"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>
    </div>
    <div id="zHint">雙指可再放大 · 點 ✕ 回到商品</div>
  </div>

  <button id="toTop" hidden aria-label="回到最上面">↑</button>
  <div id="toast" hidden></div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   資料層
   ──────────────────────────────────────────────────────────────
   省流量的做法（和舊版最大的差別）：
   · 舊版一開站就把全部 9,341 筆的列表欄位撈完（gzip 後約 120KB）。
   · 新版「只撈目前這一天」——當天 726 件的列表欄位 gzip 只有 12.5KB。
   · 日期膠囊與月曆要的「哪天有幾件」另外用一支只拿 listing_date 的查詢，
     9,341 筆 gzip 後只有 2KB（日期字串重複性極高，壓縮比驚人），
     而且是背景載入，不擋第一屏。
   · 完整的 images 與 description 一樣是點開商品才抓那一筆。
     但卡片上的縮圖列需要前幾張圖，所以當天的 images 會在背景補撈一次
     （gzip 約 68KB），回來之後就地補進縮圖列，不會造成版面跳動
     （位置先用 img_count 撐好）。
   ══════════════════════════════════════════════════════════════ */
const SB_URL="https://mhvodyzlwhnsmqmdgwgg.supabase.co";
const SB_KEY="sb_publishable_RUZz6pkJrwiWHnmdtu6jUA_7safzg1U";
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const LIST_COLS="id,name,brand,category,gender,listing_date,post_date,cover,img_count,desc_short,colors,item_type";

/* 圖片網址：資料庫可能存純檔名，也可能存完整網址，兩種都吃。
   th_ 是列表用的縮圖（約 30KB，原圖 456KB）；載不到會自動退回原圖。 */
const IMG_BASE=SB_URL+"/storage/v1/object/public/products/";
const fileOf=n=>String(n||"").split("?")[0].replace(/^.*\/products\//,"");
const imgURL=n=>{const s=String(n||"");return !s?"":(/^https?:/i.test(s)?s:IMG_BASE+encodeURIComponent(s));};
const thURL=n=>{const f=fileOf(n);return f?IMG_BASE+encodeURIComponent("th_"+f):"";};
const IMG_FALLBACK='this.onerror=null;this.src=this.dataset.full;';

/* ── 狀態 ──────────────────────────────────────────────────── */
const S={
  date:null,            // 'YYYY-MM-DD'
  items:[],             // 目前顯示的商品
  dateCounts:{},        // { 'YYYY-MM-DD': n }
  dates:[],             // 有商品的日期，新→舊
  filter:{item:null,color:null,gender:null,brand:null},   // 單選，null＝不限；各組之間疊加
  searchState:"",       // loading=還在分批撈 / done=全部撈完 / partial=中途失敗
  q:"",
  mode:"day",           // day | fav | search
  calY:null,calM:null,
  detail:null,          // {item, idx, images[]}
  rendered:0,
  range:null,           // 快速選項：1 今天 / 7 / 30（依發佈日）；null＝不是區間模式
};
const CHUNK=8;

/* localStorage：沿用舊版的 key 與格式，使用者的收藏不會不見 */
function loadSet(k){try{const s=localStorage.getItem(k);return s?new Set(JSON.parse(s)):new Set();}catch(e){return new Set();}}
function saveSet(k,set){try{localStorage.setItem(k,JSON.stringify([...set]));}catch(e){}}
let favs=loadSet("fav_fs_v2"), seen=loadSet("seen_fs");
const saveFav=()=>saveSet("fav_fs_v2",favs);
const saveSeen=()=>saveSet("seen_fs",seen);

/* ── 小工具 ────────────────────────────────────────────────── */
const $=id=>document.getElementById(id);

/* 手機是 #scroller 這個容器在捲；桌機版面改成整頁捲動，捲的是 window。
   所有跟捲動有關的事都走這三支，兩種版面才不會各寫一套。 */
const MQ_DESK=window.matchMedia("(min-width:960px)");
const isDesk=()=>MQ_DESK.matches;
const scrollEl=()=>isDesk()?document.scrollingElement:$("scroller");
function scrollToTop(smooth){
  const e=scrollEl();
  e.scrollTo?e.scrollTo({top:0,behavior:smooth?"smooth":"auto"}):(e.scrollTop=0);
}
const pad2=n=>(n<10?"0":"")+n;
/* 本機日期（不是 UTC）。舊版用 toISOString() 會讓台灣時間 00:00–08:00 差一天。 */
function todayStr(){const d=new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
const WD=["日","一","二","三","四","五","六"];
function fmtMD(iso){const d=new Date(iso+"T00:00:00");return (d.getMonth()+1)+"/"+d.getDate();}
/* 今天／昨天就不再附星期，標題才不會長到換行（手機 375px 要塞得下） */
function fmtFull(iso){const d=new Date(iso+"T00:00:00");
  const t=todayStr();const y=new Date(Date.now()-864e5);const ys=y.getFullYear()+"-"+pad2(y.getMonth()+1)+"-"+pad2(y.getDate());
  if(iso===t)return fmtMD(iso)+" 今天";
  if(iso===ys)return fmtMD(iso)+" 昨天";
  return fmtMD(iso)+"（週"+WD[d.getDay()]+"）";}
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const bLabel=b=>(!b||b==="Unknown")?"未標品牌":b;
const gLabel=g=>g==="女"?"♀ 女款":g==="男"?"♂ 男款":"♀♂ 中性款";
const gCls=g=>g==="女"?"tag-f":g==="男"?"tag-m":"tag-u";
function tier(iso){
  const d=new Date(iso+"T00:00:00"),n=new Date();n.setHours(0,0,0,0);
  const diff=Math.round((n-d)/864e5);
  if(diff<=0)return{t:"新品",c:"b-new"};
  if(diff<7)return{t:"本週",c:"b-week"};
  if(diff<31)return{t:"本月",c:"b-month"};
  return null;
}
let toastT;
function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;
  clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},2400);}

/* ══════════════════════════════════════════════════════════════
   查詢
   ══════════════════════════════════════════════════════════════ */
async function fetchDay(date){
  const {data,error}=await sb.from("fs_products").select(LIST_COLS)
    .eq("listing_date",date).order("id",{ascending:false}).limit(1000);
  if(error)throw error;
  return (data||[]).map(mapRow);
}
function mapRow(r){return{
  id:r.id,name:r.name||"",brand:r.brand||"Unknown",category:r.category||"",
  gender:r.gender||"中性",date:(r.listing_date||"").slice(0,10),
  post:(r.post_date||r.listing_date||"").slice(0,10),   // 客人看的是發佈日
  colors:Array.isArray(r.colors)?r.colors:[],item:r.item_type||"",
  cover:r.cover||"",imgCount:r.img_count||0,desc:r.desc_short||"",
  images:null,          // 背景補撈
  imgIdx:0,             // 卡片目前顯示第幾張
};}

/* 當天的 images 背景補撈，回來後就地補上縮圖列（不重畫整個列表） */
const imgCache=new Map();   // id -> images[]
async function fetchDayImages(date,ids){
  const need=ids.filter(i=>!imgCache.has(i));
  if(!need.length)return;
  try{
    const {data}=await sb.from("fs_products").select("id,images").eq("listing_date",date).limit(1000);
    (data||[]).forEach(r=>imgCache.set(r.id,Array.isArray(r.images)?r.images:[]));
  }catch(e){}
}
/* 單筆完整資料（詳情用）：完整 images + 完整 description */
const detailCache=new Map();
async function fetchDetail(id){
  if(detailCache.has(id))return detailCache.get(id);
  let v={images:[],desc:null};
  try{
    const {data,error}=await sb.from("fs_products").select("images,description").eq("id",id).single();
    if(!error&&data)v={images:Array.isArray(data.images)?data.images:[],desc:data.description||""};
  }catch(e){}
  detailCache.set(id,v);
  if(v.images.length)imgCache.set(id,v.images);
  return v;
}

/* 日期 → 件數。只撈 listing_date 一欄：9 千多筆 gzip 後只有 2KB，
   日期字串重複性極高，壓縮比很誇張。
   PostgREST 一次最多回 1000 筆，所以要分頁——先問總筆數，再「同時」把所有頁
   一起發出去。排隊一頁一頁等的話要 4 秒，膠囊列會空很久。 */
async function fetchDateCounts(){
  const counts={};
  const head=await sb.from("fs_products").select("id",{count:"exact",head:true});
  const total=head.count||0;
  const pages=Math.min(40,Math.ceil(total/1000))||1;
  const reqs=[];
  for(let i=0;i<pages;i++){
    reqs.push(sb.from("fs_products").select("listing_date")
      .order("listing_date",{ascending:false}).range(i*1000,i*1000+999));
  }
  const res=await Promise.all(reqs);
  res.forEach(r=>(r.data||[]).forEach(x=>{
    const d=(x.listing_date||"").slice(0,10);if(d)counts[d]=(counts[d]||0)+1;}));
  return counts;
}

/* ══════════════════════════════════════════════════════════════
   渲染：日期膠囊 / 進度 / 標題
   ══════════════════════════════════════════════════════════════ */
function dayDone(d){
  const n=S.dateCounts[d];
  if(!n)return false;
  if(d!==S.date)return false;        // 只有目前這天知道完整 id 清單
  return S.items.length>0&&S.items.every(p=>seen.has(p.id));
}
function renderPills(){
  const box=$("pills");
  if(!S.dates.length){box.innerHTML="";return;}
  /* S.dates 是新→舊。膠囊列要「左舊右新」，所以取最近 45 天之後再反轉。
     最新的那顆在最右邊，進站時 scrollIntoView 會把它捲進畫面。 */
  box.innerHTML=S.dates.slice(0,45).reverse().map(d=>{
    const on=S.mode==="day"&&d===S.date;
    const done=d===S.date&&dayDone(d);
    return `<button class="pill" aria-pressed="${on}" data-d="${d}">
      <b>${fmtMD(d)}</b><s>${done?"✓ ":""}${S.dateCounts[d]||0} 件</s></button>`;
  }).join("");
  box.querySelectorAll(".pill").forEach(b=>b.onclick=()=>pickDate(b.dataset.d));
  const sel=box.querySelector('[aria-pressed="true"]');
  if(sel)sel.scrollIntoView({block:"nearest",inline:"center"});
}
function renderHead(){
  layout();     /* 保險：萬一視窗事件沒送出，下一次互動也會把版面接回正確模式 */
  /* 用篩選後的 shown，不是全部 items——篩了分類之後標題也要跟著變 */
  const base=shown.length?shown:visibleItems();
  const total=base.length;
  const nSeen=base.filter(p=>seen.has(p.id)).length;
  if(S.mode==="fav"){
    $("dayTitle").textContent="我的收藏 · "+total+" 件";
    $("seenLabel").textContent="";
    $("progressFill").style.width="0%";
  }else if(S.mode==="range"){
    $("dayTitle").textContent=(S.range===1?"今天":"近 "+S.range+" 天")+"發佈 · "+total+" 件";
    $("seenLabel").textContent="";
    $("progressFill").style.width="0%";
  }else if(S.mode==="search"){
    $("dayTitle").textContent="搜尋「"+S.q+"」· "+total+" 件"
      +(S.searchState==="loading"?"，載入中…":S.searchState==="partial"?"（未載完，請重新搜尋）":"");
    $("seenLabel").textContent="";
    $("progressFill").style.width="0%";
  }else{
    $("dayTitle").textContent=S.date?(fmtFull(S.date)+" · "+total+" 件新品"):"沒有商品";
    $("seenLabel").textContent=total?("已看 "+nSeen+" / "+total):"";
    $("progressFill").style.width=(total?Math.round(nSeen/total*100):0)+"%";
  }
  renderNav();renderSummary();

  $("navFav").classList.toggle("on",S.mode==="fav");
  const fb=$("favBtn");if(fb)fb.classList.toggle("on",S.mode==="fav");
  $("navFav").querySelector("svg").setAttribute("fill",S.mode==="fav"?"currentColor":"none");
}

/* ══════════════════════════════════════════════════════════════
   渲染：商品卡
   ══════════════════════════════════════════════════════════════ */
function visibleItems(){return S.items.filter(p=>matchP(p,S.filter));}
let shown=[];
function cardHTML(p){
  const tb=tier(p.date);
  const faved=favs.has(p.id);
  const imgs=imgCache.get(p.id);
  const src=imgs&&imgs[p.imgIdx]?imgs[p.imgIdx]:p.cover;
  const multi=p.imgCount>1;
  return `<article class="card" data-id="${p.id}">
    <div class="big" data-open="${p.id}">
      <img src="${imgURL(src)}" data-full="${imgURL(src)}" alt="${esc(bLabel(p.brand))}" loading="lazy" decoding="async">
      ${tb?`<span class="badge ${tb.c}">${tb.t}</span>`:""}
      <button class="fav" data-fav="${p.id}" aria-pressed="${faved}" aria-label="收藏">
        <svg viewBox="0 0 24 24" fill="${faved?"#2f6a36":"none"}" stroke="${faved?"#2f6a36":"#fcfbf8"}" stroke-width="1.8"><path d="M12 21.3l-1.4-1.3C5.4 15.3 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.8-8.6 11.5L12 21.3z"></path></svg>
      </button>
      ${multi?`<span class="counter">${p.imgIdx+1} / ${p.imgCount}</span>`:""}
    </div>
    ${multi?`<div class="thumbs" data-thumbs="${p.id}">${thumbsHTML(p)}</div>`:""}
    <div class="info" data-open="${p.id}">
      <div class="brand">${esc(bLabel(p.brand))}</div>
      ${p.name?`<div class="name">${esc(p.name)}</div>`:""}
      <div class="tags">${tagsInner(p)}</div>
      ${p.desc?`<div class="desc">${esc(p.desc)}</div>`:""}
      <div class="meta">編號 ${p.id}　·　發佈 ${fmtMD(p.post)}</div>
    </div>
  </article>`;
}
/* 縮圖列：images 還沒回來時先用空格子撐住高度，回來再補圖，版面不會跳 */
function thumbsHTML(p){
  const imgs=imgCache.get(p.id);
  const n=Math.min(4,p.imgCount);
  let h="";
  for(let i=0;i<n;i++){
    const isMore=(i===3&&p.imgCount>4);
    const src=imgs&&imgs[i]?imgs[i]:null;
    h+=`<button data-pick="${p.id}" data-i="${isMore?3:i}" aria-pressed="${!isMore&&p.imgIdx===i}">`
      +(isMore?("+"+(p.imgCount-3))
             :(src?`<img src="${thURL(src)}" data-full="${imgURL(src)}" onerror="${IMG_FALLBACK}" alt="" loading="lazy" decoding="async">`:""))
      +`</button>`;
  }
  return h;
}
function paintChunk(){
  const slice=shown.slice(S.rendered,S.rendered+CHUNK);
  if(!slice.length){updateDone();return;}
  $("list").insertAdjacentHTML("beforeend",slice.map(cardHTML).join(""));
  S.rendered+=slice.length;
  /* 搜尋結果可能上千件，縮圖只補畫到的這批，不要一次把全部 images 撈回來 */
  if(S.mode==="search"||S.mode==="range")loadImagesFor(slice.map(p=>p.id)).then(()=>fillThumbs(slice));
  $("list").querySelectorAll(".card:not([data-w])").forEach(el=>{el.setAttribute("data-w","1");seenIO.observe(el);});
  updateDone();
  /* 自己把畫面填滿，不依賴任何事件。
     IntersectionObserver 只在「進出」的那一刻回報：補完一批之後哨兵常常還留在
     rootMargin 裡面，狀態沒變就不會再觸發，列表會停在第一批。
     所以每補完一批就量一次哨兵位置，還在視窗下緣 900px 以內就再補一批，
     直到內容長到超出一屏為止。之後再交給捲動事件接手。 */
  if(S.rendered<shown.length){
    const gap=$("sentinel").getBoundingClientRect().top-window.innerHeight;
    if(gap<900)setTimeout(paintChunk,0);
  }
}
function renderList(){
  shown=visibleItems();
  S.rendered=0;
  $("list").innerHTML="";
  $("emptyMsg").hidden=true;
  $("donewrap").hidden=true;
  if(!shown.length){
    $("emptyMsg").hidden=false;
    if(S.mode==="fav"||S.mode==="search"){
      $("emptyMsg").classList.remove("is-card");
      $("emptyMsg").innerHTML=S.mode==="fav"
        ?"還沒有收藏任何商品<br>點大圖右上角的愛心加入收藏"
        :(S.searchState==="loading"?"載入中…":S.searchState==="partial"?"搜尋失敗，請稍後再試":"找不到符合「"+esc(S.q)+"」的商品");
    }else if(activeFilter().length){renderEmpty();}
    else{
      $("emptyMsg").classList.remove("is-card");
      $("emptyMsg").innerHTML=S.mode==="range"?"這段時間沒有新品":"這天沒有新品";
    }
    renderHead();refreshFilter();return;
  }
  paintChunk();
  renderHead();
  refreshFilter();
}
/* 桌機的篩選面板是常駐的，手機則是面板開著時在裡面打字搜尋，兩種都要跟著重畫
   分類／品牌清單與「查看商品」的件數。
   （renderFilter 不碰 #searchBox，所以不會把使用者正在打的字弄掉） */
function refreshFilter(){if(isDesk()||!$("sheetFil").hidden)renderFilter();}
function updateDone(){
  const wrap=$("donewrap");
  if(!shown.length||S.rendered<shown.length||S.mode!=="day"){wrap.hidden=true;return;}
  wrap.hidden=false;
  const all=shown.every(p=>seen.has(p.id));
  const card=$("donecard");
  card.classList.toggle("all",all);
  $("doneMsg").textContent=all
    ?("🎉 "+fmtMD(S.date)+" 共 "+shown.length+" 件，已全部看完！")
    :("— "+fmtMD(S.date)+" 全部 "+shown.length+" 件已顯示 —");
  const nd=nextOlderDate();
  const b=$("btnNextDay");
  if(nd){b.hidden=false;b.textContent="看 "+fmtMD(nd)+" 的新品 →";b.onclick=()=>pickDate(nd);}
  else b.hidden=true;
}
function nextOlderDate(){
  const i=S.dates.indexOf(S.date);
  return (i>=0&&i+1<S.dates.length)?S.dates[i+1]:null;
}

/* 進畫面 40% 就算看過 */
const seenIO=new IntersectionObserver(es=>{
  let changed=false;
  es.forEach(e=>{
    if(!e.isIntersecting)return;
    const id=+e.target.dataset.id;
    if(id&&!seen.has(id)){seen.add(id);changed=true;}
    seenIO.unobserve(e.target);
  });
  if(changed){saveSeen();renderHead();renderPills();updateDone();maybeCelebrate();}
},{threshold:.4});

let celebrated=null;
function maybeCelebrate(){
  if(S.mode!=="day"||!S.date||!shown.length)return;
  if(celebrated===S.date)return;
  if(shown.every(p=>seen.has(p.id))){
    celebrated=S.date;
    toast("🎉 "+fmtMD(S.date)+" 共 "+shown.length+" 件，已全部看完！");
  }
}
const chunkIO=new IntersectionObserver(es=>{if(es[0].isIntersecting)paintChunk();},{rootMargin:"900px"});
chunkIO.observe($("sentinel"));
/* 保險絲：捲到離底部 1200px 以內就補一批。
   IntersectionObserver 在某些情況下（哨兵一直留在 rootMargin 內、
   或一次捲很長一段）不會再回報，光靠它會停住。
   手機捲 #scroller、桌機捲 window，兩邊都掛。 */
function onScroll(){
  const el=scrollEl();
  if(S.rendered<shown.length&&el.scrollHeight-el.scrollTop-el.clientHeight<1200)paintChunk();
  const t=$("toTop");
  if(t)t.hidden=!isDesk()||el.scrollTop<700;
}
$("scroller").addEventListener("scroll",onScroll,{passive:true});
window.addEventListener("scroll",onScroll,{passive:true});
$("toTop").onclick=()=>scrollToTop(true);

/* ══════════════════════════════════════════════════════════════
   切換日期 / 模式
   ══════════════════════════════════════════════════════════════ */
function showSkeleton(n){
  $("emptyMsg").hidden=true;$("donewrap").hidden=true;
  $("list").innerHTML=Array(n).fill('<div class="skel"><div class="sk-img"></div><div class="sk-txt s"></div><div class="sk-txt"></div></div>').join("");
}
async function pickDate(d){
  if(!d)return;                       /* 日期清單還沒回來時不要把畫面清空 */
  closeSheets();closeDetail(true);
  if(S.mode!=="day")resetFilter();
  S.mode="day";S.range=null;S.date=d;S.q="";$("search").value="";$("searchClear").hidden=true;
  celebrated=null;
  renderPills();renderRanges();
  showSkeleton(2);
  $("dayTitle").textContent=fmtFull(d)+" · 載入中…";
  scrollToTop();
  try{
    S.items=await fetchDay(d);
    renderList();
    const dd=new Date(d+"T00:00:00");S.calY=dd.getFullYear();S.calM=dd.getMonth();
    if(isDesk())renderCalendar();        /* 側欄月曆要跟著把選取那天改掉 */
    /* 背景補撈當天 images → 縮圖列就地補上 */
    fetchDayImages(d,S.items.map(p=>p.id)).then(fillThumbs);
  }catch(e){
    console.error(e);
    $("list").innerHTML="";$("emptyMsg").hidden=false;
    $("emptyMsg").textContent="商品載入失敗，請重新整理或稍後再試。";

/* ══════════════════════════════════════════════════════════════
   快速選項（依發佈日）：今天／近 7 天／近 30 天
   發佈日沒有值的舊商品（10-22 以前）退回用上架日判斷。
   ══════════════════════════════════════════════════════════════ */
function addDays(iso,n){const d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+n);
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
/* 發佈日在範圍內；發佈日是空的舊商品（10-22 以前）改用上架日判斷 */
function rangeCond(from,to){
  return `and(post_date.gte.${from},post_date.lte.${to}),and(post_date.is.null,listing_date.gte.${from},listing_date.lte.${to})`;
}
async function fetchRange(from,to){
  const out=[];
  const cond=rangeCond(from,to);
  for(let i=0;i<20;i++){
    const {data,error}=await sb.from("fs_products").select(LIST_COLS)
      .or(cond).order("post_date",{ascending:false}).order("id",{ascending:false})
      .range(i*1000,i*1000+999);
    if(error)throw error;
    out.push(...(data||[]).map(mapRow));
    if(!data||data.length<1000)break;
  }
  return out;
}
function renderRanges(){
  const rc=S.rangeCounts||{};
  $("ranges").innerHTML=[[1,"今天"],[7,"近 7 天"],[30,"近 30 天"]].map(([n,l])=>
    `<button data-r="${n}" aria-pressed="${S.mode==="range"&&S.range===n}"><span class="rg-n">${l}</span><span class="rg-c">${rc[n]==null?"…":fmtN(rc[n])+" 件"}</span></button>`).join("");
  $("ranges").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>pickRange(+b.dataset.r));
}
async function fetchRangeCounts(){
  const t=todayStr();
  try{
    const res=await Promise.all([1,7,30].map(n=>sb.from("fs_products").select("id",{count:"exact",head:true}).or(rangeCond(addDays(t,1-n),t))));
    S.rangeCounts={1:res[0].count||0,7:res[1].count||0,30:res[2].count||0};
  }catch(e){S.rangeCounts={};}
  renderRanges();
}
async function pickRange(days,keep){
  if(!days)return;
  closeSheets();closeDetail(true);
  if(!keep&&!(S.mode==="range"&&S.range===days))resetFilter();
  S.mode="range";S.range=days;S.date=null;S.q="";$("search").value="";$("searchClear").hidden=true;
  celebrated=null;
  renderPills();renderRanges();
  showSkeleton(2);
  $("dayTitle").textContent=(days===1?"今天":"近 "+days+" 天")+"發佈 · 載入中…";
  scrollToTop();
  const t=todayStr();
  try{
    const items=await fetchRange(addDays(t,1-days),t);
    if(S.mode!=="range"||S.range!==days)return;   /* 等待中又換了別的選項就不蓋掉 */
    S.items=items;
    renderList();
  }catch(e){
    console.error(e);
    $("list").innerHTML="";$("emptyMsg").hidden=false;
    $("emptyMsg").textContent="商品載入失敗，請重新整理或稍後再試。";
  }
}

};
const LABEL_OF={item:v=>v,color:v=>v,gender:v=>v==="女"?"女款":"男款",brand:v=>bLabel(v)};

/* 一件商品是否符合目前的條件；except 指定要略過的那一組（算件數用） */
function matchP(p,f,except){
  if(except!=="item"&&f.item&&p.item!==f.item)return false;
  if(except!=="color"&&f.color&&!p.colors.includes(f.color))return false;
  if(except!=="gender"&&f.gender&&!(p.gender===f.gender||p.gender==="中性"))return false;
  if(except!=="brand"&&f.brand&&p.brand!==f.brand)return false;
  return true;
}
function facetN(except,test){return S.items.filter(p=>matchP(p,S.filter,except)&&test(p)).length;}
function activeFilter(){return ["item","color","gender","brand"].filter(k=>S.filter[k]);}
function labelOf(k){return LABEL_OF[k](S.filter[k]);}
function setF(patch){Object.assign(S.filter,patch);renderFilter();renderList();}

/* 色塊顏色（卡片上的小色點）：金銀、多色用漸層，其餘純色 */
function colorSwatch(c){
  if(c==="金銀")return "linear-gradient(90deg,#c9a24e 50%,#b9b9b9 50%)";
  if(c==="多色")return "conic-gradient(from 0deg at 50% 50%,#b3322e 0 25%,#e8c24a 0 50%,#2f4a7a 0 75%,#5d7a4a 0)";
  return COLOR_HEX[c]||"#cfcfc4";
}
/* 色票卡的材質（麻織紋）：與設計原型的 noise()／tex('linen') 相同 */
function noiseUrl(fx,fy,oct,v,slope,icpt,seed){
  const svg="<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='"+fx+" "+fy+"' numOctaves='"+oct+"' seed='"+(seed||4)+"' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 "+v+" 0 0 0 0 "+v+" 0 0 0 0 "+v+" 0 0 0 "+slope+" "+icpt+"'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>";
  return 'url("data:image/svg+xml,'+svg.replace(/</g,'%3C').replace(/>/g,'%3E')+'")';
}
const LINEN_NOISE=noiseUrl(.75,.75,2,0,.4,-.18);
const SPECIAL_TEX={
  /* 金屬：拉絲紋＋一道整面共用的高光（左右同一個角度、同一個位置，光線一致） */
  /* 金屬：左右共用「同一張」明暗底圖（全寬、同一個角度），金色與銀色只是在上面疊半透明的色調，
     所以高光的位置、大小、角度完全一致。 */
  金銀:["repeating-linear-gradient(100deg,rgba(255,255,255,.14) 0 1px,rgba(0,0,0,.05) 1px 3px)",
    "linear-gradient(160deg,transparent 0 34%,rgba(255,255,255,.7) 46%,transparent 56%)",
    "linear-gradient(90deg,rgba(201,162,78,.62) 0 50%,rgba(160,160,160,.2) 50%)",
    "linear-gradient(160deg,#3f3f3f 0%,#b9b9b9 35%,#f2f2f2 48%,#9c9c9c 70%,#4a4a4a 100%)"].join(","),
  多色:[LINEN_NOISE,"conic-gradient(from 0deg at 50% 50%,#b3322e 0 25%,#e8c24a 0 50%,#2f4a7a 0 75%,#5d7a4a 0)"].join(",")
};
function swatchTex(c){
  if(SPECIAL_TEX[c])return SPECIAL_TEX[c];
  return [LINEN_NOISE,"repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 3px)",
    "repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 3px)",
    "linear-gradient(150deg,rgba(255,255,255,.1),rgba(0,0,0,.08))",COLOR_HEX[c]||"#cfcfc4"].join(",");
}

/* 篩選後沒有結果：說清楚找不到什麼，列出有結果的退路（附件數） */
let emptySeq=0;

  const el=$("emptyMsg");el.hidden=false;el.classList.add("is-card");

      +`<button class="sug-main" id="emptyClear">清除全部篩選</button>`;
    el._sugs=list;
  };
  draw(sugs);
  /* 近 30 天的退路要去資料庫數（目前只載了這一段），數完再補上一顆 */
  if(!(S.mode==="range"&&S.range===30)){

}

/* 近 30 天、套用目前條件的件數（伺服器數，不撈資料） */
async function countRange30(){
  const f=S.filter;
  if(f.brand==="Unknown")return 0;
  const t=todayStr();
  let q=sb.from("fs_products").select("id",{count:"exact",head:true}).or(rangeCond(addDays(t,-29),t));
  if(f.item)q=q.eq("item_type",f.item);
  if(f.color)q=q.contains("colors",[f.color]);
  if(f.gender)q=q.in("gender",f.gender==="女"?["女","中性"]:["男","中性"]);
  if(f.brand)q=q.eq("brand",f.brand);
  try{const {count,error}=await q;return error?0:(count||0);}catch(e){return 0;}
}

function fillThumbs(list){
  (list||shown.slice(0,S.rendered)).forEach(p=>{
    const box=document.querySelector('[data-thumbs="'+p.id+'"]');

    const imgs=imgCache.get(p.id);
    if(imgs&&imgs[p.imgIdx]){
      const el=document.querySelector('.card[data-id="'+p.id+'"] .big img');
      if(el&&p.imgIdx===0){/* 封面已經對了，不動 */}
    }

}
/* 切到收藏／搜尋時把分類篩選歸零。
   不然會發生「搜尋編號找不到」——其實是前一個分類篩選把它濾掉了。 */
function resetFilter(){S.filter={item:null,color:null,gender:null,brand:null};}

async function showFavs(){
  closeSheets();closeDetail(true);
  resetFilter();
  S.mode="fav";S.q="";$("search").value="";$("searchClear").hidden=true;
  renderPills();
  const ids=[...favs];
  if(!ids.length){S.items=[];renderList();scrollToTop();return;}
  showSkeleton(2);$("dayTitle").textContent="我的收藏 · 載入中…";
  scrollToTop();
  try{
    const out=[];
    for(let i=0;i<ids.length;i+=200){
      const {data}=await sb.from("fs_products").select(LIST_COLS).in("id",ids.slice(i,i+200));
      (data||[]).forEach(r=>out.push(mapRow(r)));
    }
    out.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.id-a.id);
    S.items=out;renderList();
    loadImagesFor(out.map(p=>p.id)).then(fillThumbs);
  }catch(e){S.items=[];renderList();}
}
async function loadImagesFor(ids){
  const need=ids.filter(i=>!imgCache.has(i));
  for(let i=0;i<need.length;i+=200){
    try{
      const {data}=await sb.from("fs_products").select("id,images").in("id",need.slice(i,i+200));
      (data||[]).forEach(r=>imgCache.set(r.id,Array.isArray(r.images)?r.images:[]));
    }catch(e){}
  }
}
/* 搜尋全部日期、不設上限：第一批先顯示，其餘背景分批接在後面。
   每次搜尋換一個號碼，打字打到一半的舊搜尋看到號碼變了就停，不會蓋掉新結果 */
const SEARCH_PAGE=500;
let searchSeq=0;
async function runSearch(q){
  q=(q||"").trim();
  if(!q){if(S.mode==="search")pickDate(S.date||S.dates[0]);return;}
  const seq=++searchSeq;
  const alive=()=>seq===searchSeq&&S.mode==="search";
  closeDetail(true);
  resetFilter();
  S.mode="search";S.q=q;S.searchState="loading";
  renderPills();
  showSkeleton(2);$("dayTitle").textContent="搜尋中…";
  scrollToTop();
  const safe=q.replace(/[%_,()*]/g,"");
  let pinned=[],painted=false;
  try{
    if(/^\d+$/.test(q)){
      const {data}=await sb.from("fs_products").select(LIST_COLS).eq("id",+q);
      if(!alive())return;
      pinned=data||[];
    }
    const ids=new Set(pinned.map(r=>r.id));
    for(let from=0;;from+=SEARCH_PAGE){
      const {data,error}=await sb.from("fs_products").select(LIST_COLS)
        .or(`name.ilike.*${safe}*,brand.ilike.*${safe}*,category.ilike.*${safe}*,description.ilike.*${safe}*`)
        .order("listing_date",{ascending:false}).order("id",{ascending:false})
        .range(from,from+SEARCH_PAGE-1);
      if(!alive())return;
      if(error)throw error;
      const rows=data.filter(r=>!ids.has(r.id));
      rows.forEach(r=>ids.add(r.id));
      const last=data.length<SEARCH_PAGE;
      if(last)S.searchState="done";
      if(!painted){S.items=pinned.concat(rows).map(mapRow);painted=true;renderList();}
      else appendSearchItems(rows.map(mapRow));
      if(last)return;
    }
  }catch(e){
    if(!alive())return;
    console.error(e);
    S.searchState="partial";
    if(painted){renderHead();return;}    /* 已經顯示的留著，標題會註明沒載完 */
    S.items=pinned.map(mapRow);renderList();
  }
}
function appendSearchItems(items){
  S.items=S.items.concat(items);
  if(!S.rendered){renderList();return;}    /* 第一批被篩選條件濾光了，這批可能有符合的 */
  shown=visibleItems();
  renderHead();
  refreshFilter();
  if($("sentinel").getBoundingClientRect().top-window.innerHeight<900)paintChunk();
}
